name: Build CtoC Debug APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew :sender:assembleDebug :receiver:assembleDebug

      - name: Package APKs
        run: |
          mkdir -p output
          cp sender/build/outputs/apk/debug/sender-debug.apk output/C-to-C-Sender-debug.apk
          cp receiver/build/outputs/apk/debug/receiver-debug.apk output/C-to-C-Receiver-debug.apk
          cd output
          zip CtoC-debug-APKs.zip C-to-C-Sender-debug.apk C-to-C-Receiver-debug.apk

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CtoC-debug-APKs
          path: output/CtoC-debug-APKs.zip
          if-no-files-found: error
